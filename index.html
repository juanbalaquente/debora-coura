<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planos do Site Débora Coura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna estreita como no celular. Mesmo visual nos 3 planos; muda só o que cada plano inclui. */
:root {
  --bg: #f7f0ea; --surface: #fffaf6; --ink: #2a1a1d; --muted: #74605f;
  --berry: #7a1a2c; --berry-ink: #ffffff; --gold: #94703f; --line: #e8dbd2;
  --mark-bg: #fff4c7; --mark-ink: #6b5200; --wa: #1f7a4d;
  --bar-bg: #3a1219; --bar-ink: #f7f0ea;
  --display: "Bodoni Moda", "Didot", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171012; --surface: #221719; --ink: #f5ebe6; --muted: #bba7a3;
    --berry: #e48b9c; --berry-ink: #1b1013; --gold: #d9b483; --line: #3b2a2d;
    --mark-bg: #4a3d12; --mark-ink: #ffe28a; --wa: #4cc58a;
    --bar-bg: #2b1a1e; --bar-ink: #f3ecef; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171012; --surface: #221719; --ink: #f5ebe6; --muted: #bba7a3;
  --berry: #e48b9c; --berry-ink: #1b1013; --gold: #d9b483; --line: #3b2a2d;
  --mark-bg: #4a3d12; --mark-ink: #ffe28a; --wa: #4cc58a;
  --bar-bg: #2b1a1e; --bar-ink: #f3ecef; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 500; text-wrap: balance; margin: 0; line-height: 1.12; }
p { margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* faixa do plano (some quando ela clica em "ver como cliente") */
.plan-bar { background: var(--bar-bg); color: var(--bar-ink); font-size: 14px; }
.plan-bar .wrap { padding-block: 12px; display: grid; gap: 8px; }
.plan-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.plan-name { font-family: var(--display); font-size: 20px; }
.plan-name small { font-family: var(--body); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; opacity: .75; margin-right: 6px; }
.plan-bar button { font: inherit; font-size: 12px; background: transparent; color: inherit; border: 1px solid currentColor; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.plan-bar details summary { cursor: pointer; font-weight: 600; font-size: 13px; }
.plan-bar ul { margin: 8px 0 2px; padding-left: 18px; display: grid; gap: 3px; font-size: 14px; }
.plan-bar li.no { opacity: .55; text-decoration: line-through; }
.plan-bar .note { font-size: 12px; opacity: .75; }
body.clean .plan-bar .plan-detail { display: none; }

.mark { background: var(--mark-bg); color: var(--mark-ink); border-radius: 4px; padding: 0 5px; font-weight: 600; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
body.clean .mark { background: transparent; color: inherit; padding: 0; font-weight: inherit; }

.hero { padding-block: 36px 28px; display: grid; gap: 18px; }
.logo { width: 78px; height: 78px; border-radius: 50%; border: 1.5px solid var(--gold); object-fit: cover; background: #f3e9e1; }
.hero h1 { font-size: clamp(32px, 8.5vw, 44px); }
.hero h1 em { color: var(--berry); }
.hero p.lead { color: var(--muted); font-size: 17px; max-width: 34ch; }
.hero-photo { border-radius: 2px 120px 2px 2px; aspect-ratio: 4 / 5; }
.hero .ctas { display: flex; gap: 10px; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-weight: 600; border-radius: 999px; padding: 13px 22px; font-size: 15px; }
.btn-main { background: var(--berry); color: var(--berry-ink); }
.btn-ghost { color: var(--berry); border: 1.5px solid var(--berry); padding: 11px 20px; }
.btn-wa { background: transparent; color: var(--wa); border: 1.5px solid var(--wa); padding: 10px 18px; font-size: 14px; }
.btn svg { width: 18px; height: 18px; flex: none; }

section { padding-block: 32px; border-top: 1px solid var(--line); }
.sec-head { display: grid; gap: 6px; margin-bottom: 22px; }
.sec-head h2 { font-size: 30px; }

/* tabela simples (Essencial) */
.menu { list-style: none; margin: 0; padding: 0; display: grid; }
.menu li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding-block: 14px; border-bottom: 1px dashed var(--line); }
.menu li:first-child { padding-top: 0; }
.menu .n { font-weight: 600; font-size: 17px; }
.menu .d { grid-column: 1 / -1; color: var(--muted); font-size: 14px; }
.menu .p { font-family: var(--display); font-weight: 700; font-size: 19px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.menu .p small { font-family: var(--body); font-weight: 500; font-size: 11px; color: var(--muted); margin-right: 4px; text-transform: uppercase; letter-spacing: .08em; }
.menu-cta { margin-top: 22px; }

/* vitrine (Completo e Premium) */
.services { display: grid; gap: 34px; }
.service { display: grid; gap: 12px; }
.service h3 { font-size: 25px; }
.service .why { color: var(--muted); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 4px; }
.price { font-variant-numeric: tabular-nums; display: grid; }
.price small { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.price b { font-family: var(--display); font-size: 22px; font-weight: 700; }

.ph { position: relative; aspect-ratio: 4 / 3; width: 100%; max-width: 100%; overflow: hidden; border-radius: 2px; background: var(--g, linear-gradient(160deg, #6b3a4c, #c79a7a)); }
.ph::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.07) 0 2px, transparent 2px 9px); }
.ph span { position: absolute; left: 10px; bottom: 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: rgba(0,0,0,.42); padding: 3px 8px; border-radius: 3px; }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
body.clean .ph span { display: none; }
.ba .ph span { display: block; }

/* categorias (Premium) */
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
.tabs button { font: inherit; font-size: 14px; font-weight: 600; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--berry); border-color: var(--berry); color: var(--berry-ink); }

.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; counter-increment: s; }
.steps li::before { content: counter(s); font-family: var(--display); font-size: 22px; color: var(--berry); line-height: 1.2; }
.steps b { display: block; }
.steps p { color: var(--muted); font-size: 15px; }

.combos { display: grid; gap: 14px; }
.combo { background: var(--surface); border: 1px solid var(--line); padding: 18px; display: grid; gap: 8px; }
.combo h3 { font-size: 21px; }
.combo .inc { color: var(--muted); font-size: 15px; }
.combo .save { font-size: 13px; color: var(--berry); font-weight: 600; }

.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ba .ph { aspect-ratio: 3 / 4; }
.ba-cap { color: var(--muted); font-size: 14px; margin-top: 8px; }
.gal { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; margin-bottom: 18px; }
.gal a { display: block; aspect-ratio: 1; overflow: hidden; }
.gal img { width: 100%; height: 100%; object-fit: cover; display: block; max-width: 100%; }
.video { display: grid; justify-items: center; gap: 10px; }
.video video { width: 100%; max-width: 360px; max-height: 640px; border-radius: 2px; background: #000; display: block; }

.quotes { display: grid; gap: 16px; }
blockquote { margin: 0; padding-left: 14px; border-left: 2px solid var(--gold); font-family: var(--display); font-style: italic; font-size: 18px; }
blockquote cite { display: block; font-family: var(--body); font-style: normal; font-size: 13px; color: var(--muted); margin-top: 6px; }

.faq { display: grid; gap: 2px; }
.faq details { border-bottom: 1px solid var(--line); padding-block: 12px; }
.faq summary { cursor: pointer; font-weight: 600; }
.faq p { color: var(--muted); margin-top: 6px; font-size: 15px; }

.about { display: grid; gap: 16px; }
.about .ph { aspect-ratio: 1; border-radius: 50%; width: 140px; }
.ph img { object-position: center 30%; }
/* fotos reais aparecem no formato original (sem cortar); só as muito altas ganham um limite */
.hero-photo:has(img), .service .ph:has(img), #cursos .ph:has(img) { aspect-ratio: auto !important; }
.hero-photo:has(img) img, .service .ph:has(img) img, #cursos .ph:has(img) img { position: relative; inset: auto; height: auto; max-height: 640px; display: block; }
.about > .ph:first-child img { object-position: center 22%; }

.info { display: grid; gap: 14px; }
.info dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; }
.info dt { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; padding-top: 2px; }
.info dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.info .ctas { display: flex; gap: 10px; flex-wrap: wrap; }

footer { padding-block: 28px 90px; text-align: center; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }

.float { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--wa); color: #fff; border-radius: 999px; padding: 12px 16px; display: flex; gap: 8px; align-items: center; text-decoration: none; font-weight: 600; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.22); z-index: 5; }
.float svg { width: 20px; height: 20px; }
@media (prefers-reduced-motion: no-preference) { .btn, .float { transition: transform .15s ease; } .btn:active, .float:active { transform: scale(.97); } }
</style>
<style>
.cmp-hero { padding-block: 36px 8px; display: grid; gap: 12px; }
.cmp-hero h1 { font-size: clamp(30px, 8vw, 40px); }
.cmp-hero p { color: var(--muted); max-width: 40ch; }
.plans { display: grid; gap: 18px; padding-block: 24px 40px; }
@media (min-width: 900px) { .wrap.wide { max-width: 1040px; } .plans { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; } }
.plan { background: var(--surface); border: 1px solid var(--line); padding: 22px 20px; display: grid; gap: 14px; position: relative; }
.plan.top { border: 2px solid var(--berry); }
.badge { position: absolute; top: -12px; left: 20px; background: var(--berry); color: var(--berry-ink); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
.plan h2 { font-size: 28px; }
.plan .tag { color: var(--muted); font-size: 15px; }
.plan .val { font-family: var(--display); font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
.plan .val small { font-family: var(--body); font-size: 12px; font-weight: 500; color: var(--muted); display: block; letter-spacing: .08em; text-transform: uppercase; }
.feat { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; font-size: 15px; }
.feat li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; align-items: start; }
.feat li::before { content: "✓"; color: var(--wa); font-weight: 700; }
.feat li.no { color: var(--muted); opacity: .6; }
.feat li.no::before { content: "–"; color: var(--muted); }
.plan .btn { justify-self: start; }
.mini { display: block; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.mini img { width: 100%; height: auto; display: block; max-width: 100%; }
.cmp-foot { color: var(--muted); font-size: 13px; padding-block: 0 40px; }
</style>

<main>
  <div class="wrap wide">
    <header class="cmp-hero">
      <img class="logo" src="fotos/logo.jpg" alt="Logo Débora Coura">
      <p class="eyebrow">Espaço Débora Coura · Site</p>
      <h1>Escolha o plano do seu site</h1>
      <p>Toque em "Ver prévia" pra ver como cada um fica no celular. Já usei suas fotos e seus serviços do Instagram. Os valores dos serviços ainda são exemplos.</p>
    </header>
    <div class="plans" id="plans"></div>
    <p class="cmp-foot">Pagamento único pelo site pronto. Prévias feitas por Juan.</p>
  </div>
</main>
<script>
/* ===== Troque aqui ===== */
// Preços: confirmar antes de mandar. Deixe "" pra esconder o valor.
const PLANOS = [
  { nome: "Essencial", letra: "E", valor: "400", frase: "O básico bem feito: seus serviços, valores e WhatsApp.", url: "plano-essencial.html", mini: "fotos/mini-essencial.jpg" },
  { nome: "Completo",  letra: "C", valor: "750", frase: "Vitrine com fotos, do jeito do site que você gostou.", url: "plano-completo.html", mini: "fotos/mini-completo.jpg", destaque: "Mais escolhido" },
  { nome: "Premium",   letra: "P", valor: "1.200", frase: "Tudo do Completo, mais combos, resultados, depoimentos e seus cursos.", url: "plano-premium.html", mini: "fotos/mini-premium.jpg" }
];
const RECURSOS = [["Site de uma página, feito pro celular", "ECP"], ["Foto de capa", "ECP"], ["Lista de serviços com valores", "ECP"], ["Botão de agendar pelo WhatsApp", "ECP"], ["Endereço, horários e Instagram", "ECP"], ["Foto em cada serviço", "CP"], ["WhatsApp com mensagem pronta em cada serviço", "CP"], ["Seção sobre você, com sua foto", "CP"], ["Galeria de trabalhos do Instagram", "CP"], ["Serviços separados por categoria", "P"], ["Combos de serviços", "P"], ["Antes e depois e depoimentos", "P"], ["Vídeo de transformação", "P"], ["Seção dos seus cursos para profissionais", "P"], ["Perguntas frequentes e botão Como chegar", "P"]];
/* ===== fim ===== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
document.getElementById("plans").innerHTML = PLANOS.map(p => `
  <article class="plan${p.destaque ? " top" : ""}">
    ${p.destaque ? `<span class="badge">${esc(p.destaque)}</span>` : ""}
    <h2>${esc(p.nome)}</h2>
    <p class="tag">${esc(p.frase)}</p>
    ${p.mini ? `<a class="mini" href="${esc(p.url)}"><img src="${esc(p.mini)}" alt="Como fica o plano ${esc(p.nome)} no celular" loading="lazy"></a>` : ""}
    ${p.valor ? `<p class="val"><small>Investimento único</small>R$ ${esc(p.valor)}</p>` : ""}
    <ul class="feat">${RECURSOS.map(([t, em]) => `<li class="${em.includes(p.letra) ? "" : "no"}">${esc(t)}</li>`).join("")}</ul>
    <a class="btn ${p.destaque ? "btn-main" : "btn-ghost"}" href="${esc(p.url)}">Ver prévia do ${esc(p.nome)}</a>
  </article>`).join("");
</script>
